 # Carnalitas events
 cpr_debug_msg_prostitution_random_events_0001_fired: "$cpr_debug_prefix_2$: Événement $carn_prostitution_random_events.0001.notification$ déclenché, trait_xp : [THIS.Var('trait_xp').GetValue]"
