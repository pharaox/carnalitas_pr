 # Effects
 cpr_debug_msg_using_cpr_rakish_brothel_night_effect: "$cpr_debug_prefix_2$: Utilisation de cpr_rakish_brothel_night_effect, from_stress_loss_decision : [Select_CString(THIS.Var('from_stress_loss_decision').IsSet, 'oui', 'non')]"
 cpr_debug_msg_using_vanilla_rakish_brothel_night_effect: "$cpr_debug_prefix_2$: Utilisation de vanilla_rakish_brothel_night_effect, from_stress_loss_decision : [Select_CString(THIS.Var('from_stress_loss_decision').IsSet, 'oui', 'non')]"

 # Character creation and removal
 cpr_debug_msg_creating_prostitute: "$cpr_debug_prefix_2$: Création d’une prostituée, origin : [THIS.Var('cpr_origin').GetFlagName]"
 cpr_debug_msg_removing_prostitute: "$cpr_debug_prefix_2$: Suppression d’une prostituée, origin : [THIS.Var('cpr_origin').GetFlagName]"

 # Moving characters
 cpr_debug_msg_moving_prostitute: "$cpr_debug_prefix_2$: Déplacement d’une prostituée, origin : [THIS.Var('origin').Province.GetNameNoTooltip], destination : [THIS.Var('destination').Province.GetNameNoTooltip]"

 # Starting and stopping working as prostitute
 cpr_debug_msg_can_no_longer_work_as_prostitute: "$cpr_debug_prefix_2$: Le personnage ne peut plus travailler comme prostituée"
 cpr_debug_msg_decided_to_start_working_as_prostitute: "$cpr_debug_prefix_2$: Le personnage a décidé de commencer à travailler comme prostituée, work_as_prostitute_ai_willingness : [THIS.Var('work_as_prostitute_ai_willingness').GetValue]"
 cpr_debug_msg_decided_to_stop_working_as_prostitute: "$cpr_debug_prefix_2$: Le personnage a décidé de cesser de travailler comme prostituée, work_as_prostitute_ai_willingness : [THIS.Var('work_as_prostitute_ai_willingness').GetValue]"
 cpr_debug_msg_forced_to_start_working_as_prostitute: "$cpr_debug_prefix_2$: Le personnage a été forcé à commencer à travailler comme prostituée, cpr_forced_by_owner : [THIS.Var('cpr_forced_by_owner').Char.GetFullNameNoTooltip] ([THIS.Var('cpr_forced_by_owner').Char.GetID])"
 cpr_debug_msg_forced_to_stop_working_as_prostitute: "$cpr_debug_prefix_2$: Le personnage a été forcé à cesser de travailler comme prostituée, cpr_forced_by_owner : [THIS.Var('cpr_forced_by_owner').Char.GetFullNameNoTooltip] ([THIS.Var('cpr_forced_by_owner').Char.GetID])"

 # Contract creation
 cpr_debug_msg_task_contract_created: "$cpr_debug_prefix$: Contrat créé, contract : [THIS.Var('cpr_task_contract').TaskContract.GetNameNoTooltip]"

 # Carnalitas decisions
 cpr_debug_msg_work_as_prostitute_decision_made: "$cpr_debug_prefix_2$: Décision $carn_work_as_prostitute_decision$ prise, work_as_prostitute_ai_willingness : [THIS.Var('work_as_prostitute_ai_willingness').GetValue]"
 cpr_debug_msg_stop_work_as_prostitute_decision_made: "$cpr_debug_prefix_2$: Décision $carn_stop_work_as_prostitute_decision$ prise, work_as_prostitute_ai_willingness : [THIS.Var('work_as_prostitute_ai_willingness').GetValue]"

 # Carnalitas interactions
 cpr_debug_msg_force_start_prostitution_interaction_accepted: "$cpr_debug_prefix_2$: Interaction $carn_force_start_prostitution_interaction$ acceptée, force_prostitution_ai_willingness : [THIS.Var('force_prostitution_ai_willingness').GetValue]"
 cpr_debug_msg_force_stop_prostitution_interaction_accepted: "$cpr_debug_prefix_2$: Interaction $carn_force_stop_prostitution_interaction$ acceptée, force_prostitution_ai_willingness : [THIS.Var('force_prostitution_ai_willingness').GetValue]"

