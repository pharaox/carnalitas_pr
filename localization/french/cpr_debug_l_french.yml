l_french:
 cpr_debug_prefix: "[GetCurrentDate.GetStringShort]: [THIS.Char.GetFullNameNoTooltip] ([THIS.Char.GetID])"
 cpr_debug_prefix_2: "[GetCurrentDate.GetStringShort]: [THIS.Char.GetFullNameNoTooltip] ([THIS.Char.GetID], [Select_CString(THIS.Char.IsFemale, 'femme', 'homme')])"

 # Yearly
 cpr_debug_msg_spawning_prostitutes: "[GetCurrentDate.GetStringShort]: Génération de prostituées"

 # Prostitution
 cpr_debug_msg_character_started_working_as_prostitute: "$cpr_debug_prefix_2$: Le personnage a commencé à travailler comme prostituée, cpr_event : [THIS.Var('cpr_event').GetFlagName]"
 cpr_debug_msg_character_stopped_working_as_prostitute: "$cpr_debug_prefix_2$: Le personnage a cessé de travailler comme prostituée, cpr_event : [THIS.Var('cpr_event').GetFlagName]"

 # Sex
 cpr_debug_msg_character_had_sex_with_prostitute: "$cpr_debug_prefix_2$: Le personnage a eu des relations sexuelles avec une prostituée, carn_sex_partner : [THIS.Var('carn_sex_partner').Char.GetFullNameNoTooltip] ([THIS.Var('carn_sex_partner').Char.GetID], [Select_CString(THIS.Var('carn_sex_partner').Char.IsFemale, 'femme', 'homme')])"
 cpr_debug_msg_prostitute_had_sex_with_character: "$cpr_debug_prefix_2$: La prostituée a eu des relations sexuelles avec le personnage, carn_sex_partner : [THIS.Var('carn_sex_partner').Char.GetFullNameNoTooltip] ([THIS.Var('carn_sex_partner').Char.GetID], [Select_CString(THIS.Var('carn_sex_partner').Char.IsFemale, 'femme', 'homme')])"
 cpr_debug_msg_prostitute_got_pregnant: "$cpr_debug_prefix_2$: La prostituée est tombée enceinte, père : [THIS.Var('father').Char.GetFullNameNoTooltip] ([THIS.Var('father').Char.GetID]), carn_pregnancy_chance : [THIS.Var('carn_pregnancy_chance').GetValue]"

 cpr_debug_msg_character_learned_secret: "$cpr_debug_prefix_2$: Le personnage a appris un secret, secret : [THIS.Var('learned_secret').Secret.GetName] de [THIS.Var('learned_secret').Secret.GetOwner.GetFullNameNoTooltip] ([THIS.Var('learned_secret').Secret.GetOwner.GetID])"

 # Health
 cpr_debug_msg_prostitute_got_std: "$cpr_debug_prefix_2$: La prostituée a contracté une MST, disease_type : [THIS.Var('disease_type').GetFlagName]"

 # Stress coping events
 cpr_debug_msg_stress_trait_coping_decisions_2001_fired: "$cpr_debug_prefix_2$: Événement $stress_trait_coping_decisions.2001.t$ déclenché"
 cpr_debug_msg_stress_trait_coping_decisions_2002_fired: "$cpr_debug_prefix_2$: Événement $stress_trait_coping_decisions.2002.t$ déclenché"

